
name: Compilar APK Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Localizar proyecto Android
        id: proyecto
        shell: bash
        run: |
          echo "Archivos del repositorio:"
          find . -maxdepth 4 -type f \
            \( -name 'gradlew' \
            -o -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \)

          WRAPPER=$(find . -maxdepth 5 \
            -type f -name gradlew -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "::error::No se encuentra gradlew."
            echo "Sube gradlew y gradle/wrapper/"
            exit 1
          fi

          DIR=$(dirname "$WRAPPER")
          echo "directorio=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto localizado en: $DIR"

      - name: Compilar APK
        shell: bash
        run: |
          cd "${{ steps.proyecto.outputs.directorio }}"
          chmod +x gradlew
          ./gradlew assembleDebug \
            --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 30
